name: VPN Gate Node Check

on:
  workflow_dispatch:
  schedule:
    # 每 2 小时运行一次。
    # 说明：原仓库 README 写"每 30 分钟"，但作者博客 FAQ 建议 1-2 小时
    # （低于 30 分钟易触发 VPN Gate 反爬 + 烧光免费额度），且原 workflow
    # 根本没有 schedule 触发器。按博客建议取 2 小时。
    - cron: '0 */2 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        run: python vpngate.py
        env:
          # 检测 Worker 前缀，形如 https://xxx.workers.dev/check?sstp=vpn:vpn@
          # 必须放到仓库 Secrets 里（Settings -> Secrets and variables -> Actions），不要写死在文件里
          CHECK_WORKER: ${{ secrets.CHECK_WORKER }}
          # Worker 鉴权 token（配合 PATCHES.md 里的 Worker 改造使用），同样放 Secrets
          CHECK_TOKEN: ${{ secrets.CHECK_TOKEN }}
          # 并发从 32 降到 16：免费 Worker 扛不住 32 并发长连接，易被限流/判滥用
          CHECK_CONCURRENCY: "16"
          CHECK_TIMEOUT: "60"
          # 入口优选域名，逗号分隔、必须带端口，例如：
          # cdn.example.com:443,1.2.3.4:443
          # 放 Secrets，避免公开暴露你的入口配置
          EDGE_HOSTS: ${{ secrets.EDGE_HOSTS }}
          # 优选 API：默认的第三方源（cf.090227.xyz）有注入风险。
          # 建议填自己可信的源，或留空只用 EDGE_HOSTS。
          OPTIMAL_API: ${{ secrets.OPTIMAL_API }}
          # NODES_URL 自动从 fork 信息推导，无需手动改 vpngate.py 里的用户名
          NODES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/nodes.txt

      - name: Ensure GitHub Pages is enabled (one-time auto setup)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          echo "Pages API status: $code"
          if [ "$code" = "404" ]; then
            echo "首次运行: 启用 GitHub Pages (source = GitHub Actions, 目录 /public)"
            curl -sS -X PUT \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow","source":{"branches":["main"],"path":"/public"}}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
            echo
            sleep 10
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: 'echo "site: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ (deploy outcome: ${{ steps.deployment.outcome }})"'
